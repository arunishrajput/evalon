volumes:
  evalon_postgres_data:
  evalon_redis_data:
  evalon_ollama_models:

networks:
  evalon_net:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: evalon_postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalon}
      POSTGRES_DB: ${POSTGRES_DB:-evalon}
    volumes:
      - evalon_postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evalon_net

  redis:
    image: redis:7-alpine
    container_name: evalon_redis
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - evalon_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evalon_net

  # NOTE (macOS local dev): Ollama normally runs NATIVELY on the host, not in this
  # container. Docker Desktop on macOS cannot pass through Apple Silicon's Metal GPU
  # to a container, so a containerized Ollama would run CPU-only and be far slower
  # than the native install. Default backend/worker env points OLLAMA_BASE_URL at
  # http://host.docker.internal:11434 (native host Ollama).
  #
  # This service is kept for parity with production/Linux+NVIDIA deployments and is
  # opt-in via a compose profile: `docker compose --profile docker-ollama up`.
  # Its host port is mapped to 11435 (not 11434) to avoid colliding with a native
  # Ollama install already listening on 11434.
  ollama:
    image: ollama/ollama:latest
    container_name: evalon_ollama
    restart: unless-stopped
    profiles: ["docker-ollama"]
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      - evalon_ollama_models:/root/.ollama
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evalon_net
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalon_backend
    restart: unless-stopped
    mem_limit: 2g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evalon}:${POSTGRES_PASSWORD:-evalon}@postgres:5432/${POSTGRES_DB:-evalon}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workspace:/workspace
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - evalon_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalon_worker
    restart: unless-stopped
    mem_limit: 3g
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-evalon}:${POSTGRES_PASSWORD:-evalon}@postgres:5432/${POSTGRES_DB:-evalon}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./workspace:/workspace
    command: python -m arq app.jobs.worker.WorkerSettings
    networks:
      - evalon_net
    # docker compose up --scale worker=2 is the recommended max on 24GB RAM.
    # Scaling beyond this risks model loading conflicts (see ModelQueueManager docs).

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evalon_frontend
    restart: unless-stopped
    mem_limit: 1g
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - evalon_net

  nginx:
    image: nginx:alpine
    container_name: evalon_nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - evalon_net
